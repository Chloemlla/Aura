org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.dependency.useConstraints=true
android.builtInKotlin=false
android.enableAppCompileTimeRClass=false
android.newDsl=false

# Build caching is taken from upstream. The heap stays at the fork's 3072m —
# reduced deliberately in e348ccd1 to fit a GitHub Actions runner — and picks up
# upstream's explicit metaspace cap so a runaway annotation processor fails
# loudly instead of consuming the machine.
org.gradle.caching=true

# Upstream also sets org.gradle.parallel=true and
# org.gradle.configuration-cache=true, measured on AGP 8.9.x. They are left off
# here until they can be verified on this fork's AGP 9 / Gradle 9.5.0 stack:
# parallel workers multiply the heap that f1bd075e/e348ccd1 had to shrink for CI,
# and the configuration cache has not been checked against the fork's
# downloadYtDlp task wiring.
#
# Isolated Projects is deliberately not enabled: it is still incubating in
# Gradle 9.x and is not recommended for production builds.
