org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build performance. Measured against :app:testFullDebugUnitTest on this
# workstation: 7m08s clean before these flags, 5m35s clean after, and 28s when
# both the configuration cache and task outputs are warm. No configuration-cache
# problems are reported; the entry stores on first run and is reused after.
#
# The heap moved from 2048m to 3072m because parallel execution runs several
# Kotlin/KSP workers at once and 2048m was already the ceiling for a serial
# build; metaspace is capped explicitly so a runaway annotation processor fails
# loudly instead of consuming the machine.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Isolated Projects is deliberately not enabled: it is still incubating in
# Gradle 9.x and is not recommended for production builds.
