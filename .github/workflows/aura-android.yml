# Adapted from CLens (.github/workflows/clens-android.yml)
# Aura - Open Source Device Personalization
name: Build Aura Android

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/aura-android.yml"
      - "baselineprofile/**"
      - "database.rules.json"
      - "storage.rules"
      - "firebase.json"
      - "functions/**"
      - "test/**"
      - "tools/**"
      - "lumen-crash.version"
  pull_request:
    branches:
      - "**"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/aura-android.yml"
      - "baselineprofile/**"
      - "database.rules.json"
      - "storage.rules"
      - "firebase.json"
      - "functions/**"
      - "test/**"
      - "tools/**"
      - "lumen-crash.version"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a signed GitHub Release from main"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build full release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Resolve lumen-crash SDK version
        run: |
          python .github/scripts/fetch-lumen-crash-sdk.py
        env:
          LUMEN_CRASH_READ_PACKAGES_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        run: |
          VERSION_BASE="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          SHORT_HASH="${GITHUB_SHA::8}"
          echo "AURA_ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 148))" >> "$GITHUB_ENV"
          echo "AURA_SHORT_HASH=${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_RELEASE_VERSION=${VERSION_NAME}-${SHORT_HASH}" >> "$GITHUB_ENV"

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing_secrets=()
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            for secret_name in "${missing_secrets[@]}"; do
              echo "::warning::$secret_name repository secret is not set; will build unsigned debug APK"
            done
          fi

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets, building debug variant instead"
            echo "AURA_BUILD_DEBUG=true" >> "$GITHUB_ENV"
            exit 0
          fi

          keystore_file="$RUNNER_TEMP/aura-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_file"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64."
            echo "AURA_BUILD_DEBUG=true" >> "$GITHUB_ENV"
            exit 0
          fi

          cat >> local.properties <<PROPS
          signing.keystore.path=$keystore_file
          signing.keystore.password=$KEYSTORE_PASSWORD
          signing.key.alias=$KEY_ALIAS
          signing.key.password=$KEY_PASSWORD
          PROPS

      - name: Build full release APK
        run: |
          if [ "$AURA_BUILD_DEBUG" = "true" ]; then
            ./gradlew assembleFullDebug --no-daemon
          else
            ./gradlew assembleFullRelease --no-daemon
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-build-apk
          path: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-mapping-${{ github.run_number }}
          path: |
            app/build/outputs/mapping/**/mapping.txt
            app/build/outputs/mapping/**/seeds.txt
            app/build/outputs/mapping/**/usage.txt
          # Fork PRs without signing secrets build debug (no R8 output) — warn
          # there; the release job uploads the authoritative mapping with error.
          if-no-files-found: warn
          retention-days: 90

  verify:
    name: Android Gradle verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Stop stale Gradle daemons
        run: |
          echo "Java version: $(java -version 2>&1)"
          echo "JAVA_HOME: $JAVA_HOME"
          ./gradlew --stop --no-daemon 2>/dev/null || true

      - name: Resolve lumen-crash SDK version
        run: |
          python .github/scripts/fetch-lumen-crash-sdk.py
        env:
          LUMEN_CRASH_READ_PACKAGES_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests (full flavor)
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" cleanTestFullDebugUnitTest testFullDebugUnitTest --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Run unit tests (foss flavor)
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" cleanTestFossDebugUnitTest testFossDebugUnitTest --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Run Android lint (full flavor)
        run: ./gradlew lintFullDebug --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Run Android lint (foss flavor)
        run: ./gradlew lintFossDebug --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Build FOSS release APK (unsigned)
        # -Paura.reproducibleFossBuild=true keeps the release variant (R8, resource
        # shrinking) but drops the signing config, so verification needs no keystore.
        run: ./gradlew assembleFossRelease -Paura.reproducibleFossBuild=true --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Build full release APK (unsigned, R8 verification)
        # -Paura.unsignedRelease=true keeps the full flavor's release variant (R8,
        # with Firebase/ML Kit/Play Services in the graph) but drops the signing
        # config, so fork PRs without keystore secrets still exercise the obfuscation
        # path that AURA-G10-01-class regressions live on.
        run: ./gradlew assembleFullRelease -Paura.unsignedRelease=true --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Upload FOSS APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-foss-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-verification-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*-debug.html
            app/build/reports/lint-results-*-debug.xml
            app/build/reports/problems/**
          retention-days: 14

  governance:
    name: Governance checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run Python governance tests
        # Mixed suite (unittest.TestCase classes + plain test_* functions), run
        # the way CONTRIBUTING.md documents: `python -m pytest test/tools`.
        # A venv avoids the runner image's PEP-668 externally-managed Python.
        # Landing baseline: a few live-repo drifts are pre-existing (wrapper
        # policy pins 8.12.1, workflow policy JSONs are empty while
        # aura-android.yml exists). Kept non-blocking until those are reconciled —
        # remove continue-on-error once the baseline is green (see fix-ci.md
        # AURA-G10-07 "风险与需要 CI 验证的点").
        continue-on-error: true
        run: |
          python3 -m venv /tmp/aura-governance
          /tmp/aura-governance/bin/pip install --quiet pytest
          /tmp/aura-governance/bin/python -m pytest test/tools -q

  backend:
    name: Firebase rules + functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install dependencies
        # functions/ has no committed lockfile, so it installs rather than ci.
        run: npm ci && npm --prefix functions install

      - name: Run Cloud Functions unit tests
        continue-on-error: true
        run: npm --prefix functions test

      - name: Run Firebase rules tests (emulator)
        continue-on-error: true
        run: npm run test:firebase-rules

  release:
    name: Android signed release
    needs: [build, verify, governance, backend]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Resolve lumen-crash SDK version
        run: |
          python .github/scripts/fetch-lumen-crash-sdk.py
        env:
          LUMEN_CRASH_READ_PACKAGES_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing_secrets=()
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            for secret_name in "${missing_secrets[@]}"; do
              echo "::error::$secret_name repository secret is required for signed Android releases."
            done
            exit 1
          fi

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keystore_file="$RUNNER_TEMP/aura-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_file"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi

          # Write root local.properties so the build reads CI signing credentials.
          # app/build.gradle.kts loads signing props from rootProject.file("local.properties")
          # and resolves storeFile relative to the app/ directory. Secrets enter
          # through env vars and are written verbatim — never text-interpolated
          # into the script — so '$' or backticks in a password cannot be executed.
          {
            printf 'signing.keystore.path=%s\n' "$keystore_file"
            printf 'signing.keystore.password=%s\n' "$KEYSTORE_PASSWORD"
            printf 'signing.key.alias=%s\n' "$KEY_ALIAS"
            printf 'signing.key.password=%s\n' "$KEY_PASSWORD"
          } >> local.properties

      - name: Read app version
        run: |
          VERSION_BASE="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          SHORT_HASH="${GITHUB_SHA::8}"
          echo "AURA_ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 148))" >> "$GITHUB_ENV"
          echo "AURA_SHORT_HASH=${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_RELEASE_VERSION=${VERSION_NAME}-${SHORT_HASH}" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        run: ./gradlew assembleFullRelease assembleFossRelease --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.LUMEN_CRASH_READ_PACKAGES_TOKEN }}

      - name: Prepare release assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          VERSION_NAME="${{ env.AURA_ANDROID_VERSION_NAME }}"
          SHORT_HASH="${{ env.AURA_SHORT_HASH }}"
          VERSION="${VERSION_NAME}-${SHORT_HASH}"

          for flavor in full foss; do
            APK_DIR="app/build/outputs/apk/${flavor}/release"
            # No universal APK when ABI splits are enabled; use arm64-v8a (~95% of
            # modern Android) as the primary APK, then copy all other variants too.
            AGGREGATED_APK="$(find "$APK_DIR" -maxdepth 1 -type f \( -name "app-${flavor}-universal-release.apk" -o -name "app-${flavor}-release.apk" -o -name "app-${flavor}-arm64-v8a-release.apk" \) | head -n 1)"

            if [ -z "$AGGREGATED_APK" ]; then
              echo "Aggregated signed release APK for ${flavor} was not found."
              ls -lh "$APK_DIR" || true
              continue
            fi

            cp "$AGGREGATED_APK" "$GITHUB_WORKSPACE/release-assets/Aura_android_${flavor}_${VERSION}.apk"

            for variant in armeabi-v7a arm64-v8a x86 x86_64; do
              VARIANT_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "app-${flavor}-${variant}-release.apk" | head -n 1)"
              if [ -n "$VARIANT_APK" ]; then
                cp "$VARIANT_APK" "$GITHUB_WORKSPACE/release-assets/Aura_android_${flavor}_${VERSION}_${variant}.apk"
              fi
            done
          done

          (
            cd "$GITHUB_WORKSPACE/release-assets"
            sha256sum *.apk > checksums.txt
          )

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-mapping-release-${{ github.run_number }}
          path: |
            app/build/outputs/mapping/**/mapping.txt
            app/build/outputs/mapping/**/seeds.txt
            app/build/outputs/mapping/**/usage.txt
          if-no-files-found: error
          retention-days: 90

      - name: Automatic release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          make_latest: true
          generate_release_notes: true
          tag_name: "v${{ env.AURA_ANDROID_RELEASE_VERSION }}"
          prerelease: false
          name: "Aura Android ${{ env.AURA_ANDROID_RELEASE_VERSION }}"
          files: release-assets/*