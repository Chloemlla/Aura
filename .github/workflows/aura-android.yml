# Adapted from CLens (.github/workflows/clens-android.yml)
# Aura - Open Source Device Personalization
name: Build Aura Android

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/aura-android.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/aura-android.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a signed GitHub Release from main"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build full debug APK (verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Java 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Read app version
        run: |
          VERSION_NAME="6.40.0.${GITHUB_RUN_NUMBER}"
          SHORT_HASH="${GITHUB_SHA::8}"
          echo "AURA_ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "AURA_SHORT_HASH=${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_RELEASE_VERSION=${VERSION_NAME}-${SHORT_HASH}" >> "$GITHUB_ENV"

      - name: Build full debug APK
        run: gradle assembleFullDebug --no-daemon

  verify:
    name: Android Gradle verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Java 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Run unit tests (full flavor)
        run: gradle testFullDebugUnitTest --no-daemon

      - name: Run unit tests (foss flavor)
        run: gradle testFossDebugUnitTest --no-daemon

      - name: Run Android lint (full flavor)
        run: gradle lintFullDebug --no-daemon

      - name: Run Android lint (foss flavor)
        run: gradle lintFossDebug --no-daemon

      - name: Build FOSS release APK (unsigned)
        # -Paura.reproducibleFossBuild=true keeps the release variant (R8, resource
        # shrinking) but drops the signing config, so verification needs no keystore.
        run: gradle assembleFossRelease -Paura.reproducibleFossBuild=true --no-daemon

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-verification-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*-debug.html
            app/build/reports/lint-results-*-debug.xml
            app/build/reports/problems/**
          retention-days: 14

  release:
    name: Android signed release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Java 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing_secrets=()
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            for secret_name in "${missing_secrets[@]}"; do
              echo "::error::$secret_name repository secret is required for signed Android releases."
            done
            exit 1
          fi

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          keystore_file="$RUNNER_TEMP/aura-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_file"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi

          # Write root local.properties so the build reads CI signing credentials.
          # app/build.gradle.kts loads signing props from rootProject.file("local.properties")
          # and resolves storeFile relative to the app/ directory.
          cat >> local.properties <<PROPS
          signing.keystore.path=$keystore_file
          signing.keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          signing.key.alias=${{ secrets.KEY_ALIAS }}
          signing.key.password=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Read app version
        run: |
          VERSION_NAME="6.40.0.${GITHUB_RUN_NUMBER}"
          SHORT_HASH="${GITHUB_SHA::8}"
          echo "AURA_ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "AURA_SHORT_HASH=${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "AURA_ANDROID_RELEASE_VERSION=${VERSION_NAME}-${SHORT_HASH}" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        run: gradle assembleFullRelease assembleFossRelease --no-daemon

      - name: Prepare release assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          VERSION_NAME="${{ env.AURA_ANDROID_VERSION_NAME }}"
          SHORT_HASH="${{ env.AURA_SHORT_HASH }}"
          VERSION="${VERSION_NAME}-${SHORT_HASH}"

          for flavor in full foss; do
            APK_DIR="app/build/outputs/apk/${flavor}/release"
            AGGREGATED_APK="$(find "$APK_DIR" -maxdepth 1 -type f \( -name "app-${flavor}-universal-release.apk" -o -name "app-${flavor}-release.apk" \) | head -n 1)"

            if [ -z "$AGGREGATED_APK" ]; then
              echo "Aggregated signed release APK for ${flavor} was not found."
              ls -lh "$APK_DIR" || true
              continue
            fi

            cp "$AGGREGATED_APK" "$GITHUB_WORKSPACE/release-assets/Aura_android_${flavor}_${VERSION}.apk"

            for variant in armeabi-v7a arm64-v8a x86 x86_64; do
              VARIANT_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "app-${flavor}-${variant}-release.apk" | head -n 1)"
              if [ -n "$VARIANT_APK" ]; then
                cp "$VARIANT_APK" "$GITHUB_WORKSPACE/release-assets/Aura_android_${flavor}_${VERSION}_${variant}.apk"
              fi
            done
          done

          (
            cd "$GITHUB_WORKSPACE/release-assets"
            sha256sum *.apk > checksums.txt
          )

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aura-android-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Automatic release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          make_latest: true
          generate_release_notes: true
          tag_name: "v${{ env.AURA_ANDROID_RELEASE_VERSION }}"
          prerelease: false
          name: "Aura Android ${{ env.AURA_ANDROID_RELEASE_VERSION }}"
          files: release-assets/*