// Types the Compose compiler cannot prove stable, that Aura knows are.
//
// Everything listed here is either immutable in practice or never mutated after
// it reaches a composable. Without this file, any composable taking one of these
// is inferred unstable, and that noise hides the models that genuinely are --
// which is the whole reason the metrics are being collected.
//
// Add a type only with a reason. "It made the report green" is not one.

// Kotlin collections handed to composables here are built once and read many
// times; nothing mutates a list after it enters the UI layer.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// Time and duration values, immutable by construction.
java.time.*
kotlin.time.Duration
